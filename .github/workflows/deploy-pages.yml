name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run
      - run: pnpm exec tsc --noEmit
      - run: pnpm --dir apps/web build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Keep compatibility assets for cached pages
        run: |
          for name in index-yNyrwHFq index-DSctGXCD; do cp apps/web/dist/assets/app.js "apps/web/dist/assets/${name}.js"; done
          for name in index-DE2mLamD index-DeO8UgnG; do cp apps/web/dist/assets/app.css "apps/web/dist/assets/${name}.css"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Wait for Pages artifact registration
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
